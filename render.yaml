services:
  - type: web
    name: fanfare
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MOUNT_FRONTEND
        value: "true"
      - key: LLM_PROVIDER
        value: ai_studio
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: worldcup_2026
