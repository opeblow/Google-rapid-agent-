services:
  - type: web
    name: wc2026-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: worldcup_2026
