services:
  - type: web
    name: fanfare
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MOUNT_FRONTEND
        value: "true"
      - key: LLM_PROVIDER
        value: vertex_ai
      - key: VERTEX_AI_PROJECT
        value: green-segment-498716-u8
      - key: VERTEX_AI_LOCATION
        value: us-central1
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: worldcup_2026
